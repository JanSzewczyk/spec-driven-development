name: Plugin Checks ✅

# Added by /plugin-setup. Fails a pull request whose manifests or docs drifted from the plugins
# on disk, or in which a plugin changed and its version did not. Every job runs one shared action
# at the ref named below, so nothing is vendored into this repository.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests and Docs 🔍
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Check manifests and documentation 🔍
        uses: JanSzewczyk/claude-plugins/.github/actions/marketplace-audit@main
        # Inputs: strict, path.

  version-bumps:
    name: Version Bumps 🏷️
    # Fails a pull request in which a plugin changed and its version did not. Works in a marketplace
    # and in a single-plugin repo, and fetches the base history itself, so no fetch-depth: 0.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Check every changed plugin has a version bump 🏷️
        uses: JanSzewczyk/claude-plugins/.github/actions/version-bump-check@main
        # Inputs: strict (also fail a bump that is too small), ignore-plugins, base-ref, path.

  plugins-cli:
    name: Plugins in the CLI 🔌
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Check every plugin loads 🔌
        uses: JanSzewczyk/claude-plugins/.github/actions/plugin-load-check@main
      - name: Check every plugin installs from the marketplace 📦
        uses: JanSzewczyk/claude-plugins/.github/actions/plugin-install-check@main
      - name: Check the always-on token budget ⚖️
        uses: JanSzewczyk/claude-plugins/.github/actions/plugin-budget-check@main
        # Inputs: api-key (counted instead of estimated tokens), budget-warn, budget-fail.

  skills:
    name: Skill Audit 🔎
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Audit every skill 🔎
        uses: JanSzewczyk/claude-plugins/.github/actions/skill-audit@main
        # Inputs: path, skills-glob (default plugins/*/skills/*/).

  # Not managed by /plugin-setup: the shared TypeScript copies and the plugin tests.
  tests:
    name: Plugin Tests 🧪
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Check the shared core copies are in sync 🔗
        run: scripts/sync-core.sh --check
      - name: Install Claude Code 🤖
        run: npm install -g @anthropic-ai/claude-code
      - name: Test sdd 🧪
        run: claude plugin test
        working-directory: plugins/sdd
      - name: Test sdd-board 🧪
        run: claude plugin test
        working-directory: plugins/sdd-board
