name: plugin-checks

# Added by /plugin-dev-setup. Fails a pull request whose manifests or docs drifted from the plugins
# on disk, or that changed a plugin without bumping its version.
# The checks come from the shared action on claude-plugins `main`, so nothing is vendored here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: JanSzewczyk/claude-plugins/.github/actions/plugin-checks@main
